name: 🤖 Sync Instagram Posts

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas
  workflow_dispatch:          # lanzamiento manual desde GitHub → Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install instaloader
        run: pip install instaloader --quiet

      - name: Run Instagram sync agent
        run: python scripts/sync-instagram.py
        env:
          DATA_FILE: src/data/noticias.manual.json
          MAX_POSTS: "12"

      - name: Commit changes (if any)
        run: |
          git config user.name  "instagram-sync-bot"
          git config user.email "sentimientocordobe@outlook.com"
          git add src/data/noticias.manual.json

          if git diff --staged --quiet; then
            echo "📭 Sin cambios. Nada que commitear."
          else
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "🤖 Instagram sync · $TIMESTAMP"
            git push
            echo "🚀 Push realizado. Vercel redesplega automáticamente."
          fi
