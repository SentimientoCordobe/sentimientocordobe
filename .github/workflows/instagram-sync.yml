name: 🤖 Sync Instagram Posts

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright --quiet
          playwright install chromium --with-deps

      - name: Run Instagram sync agent
        run: python scripts/sync-instagram.py
        env:
          IG_SESSION_ID: ${{ secrets.IG_SESSION_ID }}
          DATA_FILE:     src/data/noticias.manual.json
          MAX_POSTS:     "12"

      - name: Commit changes (if any)
        run: |
          git config user.name  "instagram-sync-bot"
          git config user.email "bot@sentimientocordobe.com"
          git add src/data/noticias.manual.json

          if git diff --staged --quiet; then
            echo "📭 Sin cambios."
          else
            git commit -m "🤖 Instagram sync · $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "🚀 Push realizado."
          fi
